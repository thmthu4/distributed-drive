version: '3.8'

services:
  master:
    build: .
    environment:
      - SERVICE_TYPE=master
      - DB_FOLDER=/app/data
      - NODE_REGISTRATION_KEY=${NODE_REGISTRATION_KEY:-default_cluster_secret}
    ports:
      - "5000:5000"
    volumes:
      - ./data/metadata:/app/data
    networks:
      - drive-net

  storage1:
    build: .
    environment:
      - SERVICE_TYPE=storage
      - PORT=5001
      - MASTER_URL=${MASTER_URL:-http://master:5000}
      - NODE_IP=${NODE_IP:-127.0.0.1}
      - NODE_REGISTRATION_KEY=${NODE_REGISTRATION_KEY:-default_cluster_secret}
    ports:
      - "5001:5001"
    volumes:
      - ./data/storage1:/app/data_5001
    networks:
      - drive-net

  storage2:
    build: .
    environment:
      - SERVICE_TYPE=storage
      - PORT=5002
      - MASTER_URL=${MASTER_URL:-http://master:5000}
      - NODE_IP=${NODE_IP:-127.0.0.1}
      - NODE_REGISTRATION_KEY=${NODE_REGISTRATION_KEY:-default_cluster_secret}
    ports:
      - "5002:5002"
    volumes:
      - ./data/storage2:/app/data_5002
    networks:
      - drive-net

  storage3:
    build: .
    environment:
      - SERVICE_TYPE=storage
      - PORT=5003
      - MASTER_URL=${MASTER_URL:-http://master:5000}
      - NODE_IP=${NODE_IP:-127.0.0.1}
      - NODE_REGISTRATION_KEY=${NODE_REGISTRATION_KEY:-default_cluster_secret}
    ports:
      - "5003:5003"
    volumes:
      - ./data/storage3:/app/data_5003
    networks:
      - drive-net

networks:
  drive-net:
